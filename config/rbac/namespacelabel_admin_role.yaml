# This rule is not used by the project namespacelabel-assignment-shv itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over namespacelabel.dana.exam.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: namespacelabel-assignment-shv
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: namespacelabel-admin-role
rules:
- apiGroups:
  - namespacelabel.dana.exam
  resources:
  - namespacelabels
  verbs:
  - '*'
- apiGroups:
  - namespacelabel.dana.exam
  resources:
  - namespacelabels/status
  verbs:
  - get
